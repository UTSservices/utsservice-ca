<form class="planner reqform" id="reqform" action="https://api.web3forms.com/submit" method="POST" aria-label="Request service">
        <p class="mono ptitle">Request service</p>
        <input type="hidden" name="access_key" value="{{W3F_KEY}}">
        <input type="hidden" name="subject" value="New service request from utsservice.ca">
        <input type="hidden" name="from_name" value="UTS Service website">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <div class="fgrid">
          <label>Name<input name="name" autocomplete="name" required></label>
          <label>Company or building<input name="company" autocomplete="organization"></label>
          <label>Email<input type="email" name="email" autocomplete="email" required></label>
          <label>Phone<input type="tel" name="phone" autocomplete="tel" required></label>
          <label class="full">Building address<input name="address" autocomplete="street-address"></label>
          <label>Property type<select name="property_type" required><option value="">Choose one</option><option>Apartment or condo</option><option>Retail or franchise</option><option>Office or commercial</option><option>Industrial</option><option>Government or public building</option><option>Other</option></select></label>
          <label>How urgent?<select name="urgency" required><option value="">Choose one</option><option>Within 3 hours</option><option>Today</option><option>Any time this week</option><option>When available</option></select></label>
        </div>
        <fieldset><legend>What do you need? (pick any)</legend><div class="checks">
          <label><input type="checkbox" name="service" value="Access control">Access control</label>
          <label><input type="checkbox" name="service" value="Automatic doors">Automatic doors</label>
          <label><input type="checkbox" name="service" value="Locksmith or hardware">Locksmith or hardware</label>
          <label><input type="checkbox" name="service" value="Door repair">Door repair</label>
          <label><input type="checkbox" name="service" value="Storefront glass">Storefront glass</label>
          <label><input type="checkbox" name="service" value="Fire-rated doors">Fire-rated doors</label>
          <label><input type="checkbox" name="service" value="Intercom or buzzer">Intercom or buzzer</label>
          <label><input type="checkbox" name="service" value="Other">Other</label>
        </div></fieldset>
        <label class="full">Details<textarea name="message" rows="4" placeholder="Which doors, what is happening, anything we should know"></textarea></label>
        <div class="row"><button type="submit" class="btn btn-primary">Send request</button></div>
        <p class="pnote" data-status aria-live="polite">Goes straight to the UTS team. Rather talk? Call <a href="tel:+16477777411">647-777-7411</a>.</p>
      </form>
